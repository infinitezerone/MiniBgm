name: Android CI

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

# 同分支新推送取消仍在跑的旧任务，避免排队浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      # 项目固定 JVM toolchain 25（Kotlin jvmTarget 25），CI JDK 必须对齐
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      # 依赖 + 构建缓存（含 build-cache-1）：非 main 分支只读，避免 PR 污染缓存
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 单次调用合并四项检查：共享同一次配置阶段与 daemon
      # （此前拆成多次 ./gradlew 调用，每次都付一遍配置开销）
      # AGP 9 迁移后：KMP 模块测试任务为 testAndroid，全量套件是 allTests（test 仅剩 app/designsystem 空壳）；
      # allTests 是 KMP 聚合任务，不覆盖 Android-only 模块（:app/:feature:*等），
      # 因此根级 testDebugUnitTest 必须同时声明，否则那些模块的单测在 CI 从不执行
      - name: Spotless + Tests + CRAP Check + Assemble
        run: ./gradlew spotlessCheck allTests testDebugUnitTest crapCheck assembleDebug --stacktrace

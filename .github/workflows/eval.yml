name: App Evaluator

# 应用操作型评估器：CI 模拟器上跑脚本化场景并采集证据（截图 / UI 树 / logcat）。
# 本地弱机不起模拟器——判卷在会话侧离线完成（gh run download 拉取 artifact 后对照验收契约裁决）。
# 证据是一等公民：跑成功也拉取归档，pass 与 fail 共用同一份证据。
on:
  push:
    paths:
      - 'app/**'
      - 'feature/subject/**'
      - 'core/data/**'
      - '.github/workflows/eval.yml'
  schedule:
    - cron: '0 19 * * *' # 北京时间每天 03:00 全量
  workflow_dispatch:
    inputs:
      scenario:
        description: '单跑场景名（缺省 all 全量；当前可用: cold_start_nav）'
        required: false
        default: 'all'

# 同分支新推送取消仍在跑的旧评估，避免模拟器任务排队占满并发
concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Emulator Evaluator (冒烟 + 证据采集)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # 与 ci.yml build 作业同源：APK 缺预构建 .so 会硬失败，必须先编 Rust 原生库
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-

      - name: Install cargo-ndk
        run: which cargo-ndk >/dev/null 2>&1 || cargo install cargo-ndk --locked

      - name: Install Android NDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager")"
          if ! yes | "$SDKMANAGER" --install "ndk;27.2.12479018" > /dev/null 2>&1; then
            echo "::warning::NDK 27.2.12479018 安装失败，回退使用镜像自带 NDK"
          fi
          ls -1 "${ANDROID_HOME}/ndk"

      - name: Build Rust Android native libraries
        run: bash tools/build-native

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger
          ls -l /dev/kvm

      - name: Run evaluator on emulator
        uses: reactivecircus/android-emulator-roller@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: |
            SCENARIO="${{ github.event.inputs.scenario || 'all' }}"
            set +e
            ./gradlew :app:connectedDebugAndroidTest --stacktrace \
              -Pandroid.testInstrumentationRunnerArguments.scenario="$SCENARIO"
            TEST_RC=$?
            # 测试失败也要拉证据（失败诊断的第一现场）；目录不存在（装包都没成）时静默放过
            adb pull /sdcard/Android/data/com.infinitezerone.minibgm.debug/files/eval-evidence eval-evidence || true
            find eval-evidence -type f 2>/dev/null | head -50
            exit $TEST_RC

      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-evidence-${{ github.run_id }}
          path: eval-evidence/
          if-no-files-found: ignore
          retention-days: 30

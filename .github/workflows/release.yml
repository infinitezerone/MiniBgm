name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Verify & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      # 项目固定 JVM toolchain 25（Kotlin jvmTarget 25），CI JDK 必须对齐
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      # 依赖 + 构建缓存（与 CI 同一套 actions 缓存）
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 正式签名：从 Actions secrets 还原 keystore 与 keystore.properties。
      # tag 触发的发布必须配置签名（fail hard）：debug 签名的 release 无法覆盖安装，
      # 发布出去就是废包，绝不允许静默回退；workflow_dispatch 仅作构建演练，允许回退。
      - name: Restore signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::tag 触发的发布必须配置签名 secrets（SIGNING_KEYSTORE_BASE64 等），拒绝以 debug 签名发布"
              exit 1
            fi
            echo "::warning::签名 secrets 未配置，本次 workflow_dispatch 以 debug 签名构建（仅用于演练，不会发布）"
            exit 0
          fi
          mkdir -p keystore
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > keystore/minibgm-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/minibgm-release.jks
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          EOF
          echo "keystore restored"

      # Rust ECH 原生库是 assemble 的硬前置（.so 不入库）：发布链路必须自带工具链，
      # 并把与 CI 相同的 Rust 门禁再跑一遍——tag 可指向历史提交，不能靠"CI 当时绿过"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Install cargo-ndk
        run: which cargo-ndk >/dev/null 2>&1 || cargo install cargo-ndk --locked

      - name: Install Android NDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager")"
          # 固定版本优先；失败则回退镜像自带 NDK（tools/build-native 会自动选取最高可用版本）
          if ! yes | "$SDKMANAGER" --install "ndk;27.2.12479018" > /dev/null 2>&1; then
            echo "::warning::NDK 27.2.12479018 安装失败，回退使用镜像自带 NDK"
          fi
          ls -1 "${ANDROID_HOME}/ndk"

      - name: Verify & build Rust native stack
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          bash tools/build-native

      # 发布前必须通过与 CI 完全一致的静态门禁：tag 可指向任意历史提交，
      # 若不在发布前重新验证，等于绕过 CI 直接发版（同 job 内串行执行，共享 daemon）
      - name: Verify (spotless + tests + CRAP)
        run: ./gradlew spotlessCheck allTests testDebugUnitTest crapCheck --stacktrace

      # 版本注入：tag 是版本的唯一事实源（versionName = tag 去 v 前缀；
      # versionCode = major*10000 + minor*100 + patch，随 semver 单调递增），
      # 根除"tag 与产物版本不一致 / versionCode 未递增导致无法覆盖安装"两类事故
      - name: Compute version from tag
        if: startsWith(github.ref, 'refs/tags/')
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "versionName=$VERSION" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag $GITHUB_REF_NAME -> versionName=$VERSION versionCode=$CODE"

      - name: Build APK
        run: |
          ARGS=(assembleRelease --stacktrace)
          # ABI 分包默认关闭（debug 只打 1 个包以省掉重复打包），发版必须显式开启
          ARGS+=("-Pminibgm.abiSplits=true")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ARGS+=("-Pminibgm.versionName=${{ steps.version.outputs.versionName }}" "-Pminibgm.versionCode=${{ steps.version.outputs.versionCode }}")
          fi
          ./gradlew "${ARGS[@]}"

      # 发版产物断言：ABI 分包若没生效，release 会静默退化成单个 fat APK，
      # 下游的分 ABI 资产与 universal 别名会全部变形——这里直接判死，不让它流到发布步骤
      - name: Verify ABI split artifacts
        run: |
          ls -1 app/build/outputs/apk/release/*.apk
          for abi in arm64-v8a x86_64 universal; do
            if [ ! -f "app/build/outputs/apk/release/app-$abi-release.apk" ]; then
              echo "::error::缺少 app-$abi-release.apk：ABI 分包未生效，检查 assembleRelease 是否传了 -Pminibgm.abiSplits=true"
              exit 1
            fi
          done

      - name: Collect artifacts
        run: |
          mkdir -p release-artifacts
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            filename=$(basename "$apk" .apk)
            suffix="${filename#app-}"
            cp "$apk" "release-artifacts/MiniBgm-${{ github.ref_name }}-${suffix}.apk"
          done
          # 同时保留默认 release.apk 别名（使用 universal 包），确保外部自动更新/下载脚本兼容
          if [ -f "app/build/outputs/apk/release/app-universal-release.apk" ]; then
            cp "app/build/outputs/apk/release/app-universal-release.apk" "release-artifacts/MiniBgm-${{ github.ref_name }}-release.apk"
          fi
          # 混淆 release 的堆栈还原依赖 mapping.txt，必须随版本归档。
          # 原文件 80+ MB（R8 横向类合并后，成员行要写全限定名），gzip 后约 6 MB——15 倍差距。
          # 下载者 gunzip 一次即可，信息不丢。
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            gzip -9 -c app/build/outputs/mapping/release/mapping.txt \
              > "release-artifacts/MiniBgm-${{ github.ref_name }}-mapping.txt.gz"
          fi
          # BT 边下边播原生扩展（约 10MB/架构）不内置于基础 APK，作为独立资产随 Release 发布供客户端按需动态下载加载。
          # 目标 ABI 集合来自唯一真源 native/abis.txt，不要在 workflow 里重复硬编码。
          while IFS= read -r abi || [ -n "$abi" ]; do
            abi="$(printf '%s' "$abi" | tr -d '\r' | sed 's/#.*$//' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            case "$abi" in '' ) continue ;; esac
            so_file="core/data/build/torrent-native/jniLibs/${abi}/libminibgm_torrent.so"
            if [ -f "$so_file" ]; then
              cp "$so_file" "release-artifacts/libminibgm_torrent-${abi}.so"
            else
              echo "::error::缺少按需扩展产物 $so_file"
              exit 1
            fi
          done < native/abis.txt
          ls -la release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-artifacts/*
          generate_release_notes: true

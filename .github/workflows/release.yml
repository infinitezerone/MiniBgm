name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Verify & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          path: BgmPlus

      # 复合构建依赖（includeBuild("../MiniAgent")）
      - name: Checkout MiniAgent (composite build)
        uses: actions/checkout@v5
        with:
          repository: infinitezerone/MiniAgent
          path: MiniAgent

      # 项目固定 JVM toolchain 25（Kotlin jvmTarget 25），CI JDK 必须对齐
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      # 依赖 + 构建缓存（与 CI 同一套 actions 缓存）
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x BgmPlus/gradlew

      # 正式签名：从 Actions secrets 还原 keystore 与 keystore.properties。
      # tag 触发的发布必须配置签名（fail hard）：debug 签名的 release 无法覆盖安装，
      # 发布出去就是废包，绝不允许静默回退；workflow_dispatch 仅作构建演练，允许回退。
      - name: Restore signing keystore
        working-directory: BgmPlus
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::tag 触发的发布必须配置签名 secrets（SIGNING_KEYSTORE_BASE64 等），拒绝以 debug 签名发布"
              exit 1
            fi
            echo "::warning::签名 secrets 未配置，本次 workflow_dispatch 以 debug 签名构建（仅用于演练，不会发布）"
            exit 0
          fi
          mkdir -p keystore
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > keystore/minibgm-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/minibgm-release.jks
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          EOF
          echo "keystore restored"

      # 发布前必须通过与 CI 完全一致的静态门禁：tag 可指向任意历史提交，
      # 若不在发布前重新验证，等于绕过 CI 直接发版（同 job 内串行执行，共享 daemon）
      - name: Verify (spotless + tests + CRAP)
        working-directory: BgmPlus
        run: ./gradlew spotlessCheck allTests testDebugUnitTest crapCheck --stacktrace

      # 版本注入：tag 是版本的唯一事实源（versionName = tag 去 v 前缀；
      # versionCode = major*10000 + minor*100 + patch，随 semver 单调递增），
      # 根除"tag 与产物版本不一致 / versionCode 未递增导致无法覆盖安装"两类事故
      - name: Compute version from tag
        working-directory: BgmPlus
        if: startsWith(github.ref, 'refs/tags/')
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "versionName=$VERSION" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag $GITHUB_REF_NAME -> versionName=$VERSION versionCode=$CODE"

      - name: Build APK
        working-directory: BgmPlus
        run: |
          ARGS=(assembleRelease --stacktrace)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ARGS+=("-Pminibgm.versionName=${{ steps.version.outputs.versionName }}" "-Pminibgm.versionCode=${{ steps.version.outputs.versionCode }}")
          fi
          ./gradlew "${ARGS[@]}"

      - name: Collect artifacts
        working-directory: BgmPlus
        run: |
          mkdir -p release-artifacts
          APK=app/build/outputs/apk/release/app-release.apk
          [ -f "$APK" ] || APK=app/build/outputs/apk/release/app-release-unsigned.apk
          cp "$APK" "release-artifacts/MiniBgm-${{ github.ref_name }}-release.apk"
          # 混淆 release 的堆栈还原依赖 mapping.txt，必须随版本归档
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt \
              "release-artifacts/MiniBgm-${{ github.ref_name }}-mapping.txt"
          fi
          ls -la release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-artifacts/*
          generate_release_notes: true

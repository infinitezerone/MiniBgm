org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true
# 守护进程空闲 30 分钟自动退出释放内存（Gradle 默认 3 小时）。
# 之前设 1 分钟是为了模拟“关掉 Android Studio 就回收内存”，但有 AS 时退出会自动 --stop；
# 现在不常开 AS，1 分钟只会导致每次隔一会儿就冷启动。换成 30 分钟：工作期常驻不动，
# 停手 30 分钟后自动释放（无需手动 --stop）。
org.gradle.daemon.idletimeout=1800000
# Configuration cache：跳过重复配置阶段（CI 单次冷启动与本地增量构建都受益）
org.gradle.configuration-cache=true
# Gradle 9：并行存储/加载配置缓存工作图（incubating，构建不兼容时自动回退）
org.gradle.configuration-cache.parallel=true
# AGP 资源编译缓存：库资源未变时直接复用编译产物
android.experimental.cacheCompileLibResources=true
android.experimental.enableSourceSetPathsMap=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle
org.gradle.tooling.parallel=true
